<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodTech - Meu perfil</title>
  <meta name="description" content="Veja seus dados, suas doações e as configurações da sua conta FoodTech.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <div class="profile-layout">
    <header class="profile-topbar">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24 4C24 4 14 10 14 20C14 26.6274 18.4772 30 24 30C29.5228 30 34 26.6274 34 20C34 10 24 4 24 4Z" fill="#0F7D46"/>
        <path d="M10 44C10 34 16 28 24 28C20 32 18 38 18 44H10Z" fill="#F57C00"/>
      </svg>
      <span class="brand">Food<span>Tech</span></span>
    </header>

    <nav class="profile-tabs" role="tablist" aria-label="Seções do perfil">
      <button type="button" role="tab" id="tab-perfil" class="profile-tab active" aria-selected="true" aria-controls="panel-perfil">Perfil</button>
      <button type="button" role="tab" id="tab-doacoes" class="profile-tab" aria-selected="false" aria-controls="panel-doacoes">Doações feitas</button>
      <button type="button" role="tab" id="tab-config" class="profile-tab" aria-selected="false" aria-controls="panel-config">Configurações</button>
    </nav>

    <main class="profile-content">
      
      <section id="panel-perfil" role="tabpanel" aria-labelledby="tab-perfil">
        <div class="card">
          <div class="profile-hero">
            <div id="profile-avatar" class="profile-avatar" aria-hidden="true"></div>
            <div>
              <h1 id="profile-display-name"></h1>
              <span id="profile-role" class="profile-role"></span>
              <div class="photo-actions">
                <label for="photo-input" class="btn btn-secondary btn-small">Alterar foto</label>
                <input type="file" id="photo-input" accept="image/*" hidden>
                <button type="button" id="photo-remove" class="btn btn-secondary btn-small" hidden>Remover</button>
              </div>
              <p id="photo-msg" class="form-msg error" role="alert" hidden></p>
            </div>
          </div>

          <form id="profile-form" novalidate>
            <div class="field-grid">
              <div class="field"><label for="name">Nome completo</label><input id="name" type="text" autocomplete="name" readonly></div>
              <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" readonly></div>
              <div class="field"><label for="phone">Telefone</label><input id="phone" type="tel" autocomplete="tel" readonly></div>
            </div>
            <p id="profile-msg" class="form-msg" role="status" hidden></p>
            <div class="actions">
              <button type="button" id="edit-button" class="btn btn-primary">Editar perfil</button>
              <button type="submit" id="save-button" class="btn btn-primary" hidden>Salvar alterações</button>
              <button type="button" id="cancel-button" class="btn btn-secondary" hidden>Cancelar</button>
            </div>
          </form>
        </div>
      </section>

      
      <section id="panel-doacoes" role="tabpanel" aria-labelledby="tab-doacoes" hidden>
        <h2>Doações feitas</h2>
        <ul id="donation-list" class="donation-list"></ul>
      </section>

      
      <section id="panel-config" role="tabpanel" aria-labelledby="tab-config" hidden>
        <h2>Configurações</h2>
        <div class="settings-grid">
          <form id="password-form" class="card" novalidate>
            <h3>Alterar senha</h3>
            <div class="field"><label for="current-password">Senha atual</label><input id="current-password" type="password" autocomplete="current-password"></div>
            <div class="field"><label for="new-password">Nova senha</label><input id="new-password" type="password" autocomplete="new-password"></div>
            <div class="field"><label for="confirm-password">Confirmar nova senha</label><input id="confirm-password" type="password" autocomplete="new-password"></div>
            <p id="password-msg" class="form-msg" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Alterar senha</button>
          </form>

          <div class="card">
            <h3>Notificações</h3>
            <label class="check"><input type="checkbox" checked> Receber e-mails sobre minhas doações</label>
            <label class="check"><input type="checkbox" checked> Avisar quando uma ONG responder</label>
            <h3 class="spaced">Conta</h3>
            <button type="button" id="logout-button" class="btn btn-secondary">Sair da conta</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../services/profileService.js"></script>
  <script src="profile.js"></script>
</body>
</html>
