<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodTech - Criar conta</title>
  <meta name="description" content="Cadastre-se no FoodTech como doador ou ONG e faça parte da rede que combate o desperdício de alimentos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main class="register-page">
    <div class="register-card">
      <div class="register-brand">
        <svg class="register-brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 4C24 4 14 10 14 20C14 26.6274 18.4772 30 24 30C29.5228 30 34 26.6274 34 20C34 10 24 4 24 4Z" fill="#0F7D46"/>
          <path d="M10 44C10 34 16 28 24 28C20 32 18 38 18 44H10Z" fill="#F57C00"/>
        </svg>
        <span class="register-brand-name">Food<span class="register-brand-accent">Tech</span></span>
      </div>

      <h1>Criar sua conta</h1>
      <p class="register-subtitle">Escolha como deseja se cadastrar.</p>

      <div class="register-tabs" role="tablist">
        <button type="button" class="register-tab active" data-role="doador" role="tab" aria-selected="true">
          Doador
        </button>
        <button type="button" class="register-tab" data-role="ong" role="tab" aria-selected="false">
          ONG
        </button>
      </div>

      <form id="register-form" novalidate>
        <input type="hidden" id="role" name="role" value="doador">

        <label for="name">Nome completo</label>
        <div class="register-input-wrapper">
          <svg class="register-input-icon" viewBox="0 0 24 24" fill="none" stroke="#8A8574" stroke-width="1.6">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
          </svg>
          <input id="name" name="name" type="text" placeholder="Seu nome completo" autocomplete="name" required>
        </div>

        <label for="email">E-mail</label>
        <div class="register-input-wrapper">
          <svg class="register-input-icon" viewBox="0 0 24 24" fill="none" stroke="#8A8574" stroke-width="1.6">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
          <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
        </div>

        <label for="phone">Telefone</label>
        <div class="register-input-wrapper">
          <svg class="register-input-icon" viewBox="0 0 24 24" fill="none" stroke="#8A8574" stroke-width="1.6">
            <path d="M5 4h3l2 5-2.5 1.5a11 11 0 005 5L14 13l5 2v3a2 2 0 01-2 2A15 15 0 015 6a2 2 0 012-2z"/>
          </svg>
          <input id="phone" name="phone" type="tel" placeholder="(00) 00000-0000" autocomplete="tel" required>
        </div>

        <label for="password">Senha</label>
        <div class="register-input-wrapper">
          <svg class="register-input-icon" viewBox="0 0 24 24" fill="none" stroke="#8A8574" stroke-width="1.6">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 118 0v3"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="Crie uma senha" autocomplete="new-password" required>
        </div>

        <div id="register-errors" class="register-errors" role="alert" hidden>
          <strong>Corrija os itens abaixo:</strong>
          <ul id="register-errors-list"></ul>
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <p class="register-footer-link">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </p>
    </div>
  </main>

  <script src="register.js"></script>
</body>
</html>
