<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil da ONG — FoodTech</title>
    <meta name="description" content="Conheça a ONG antes de doar.">
    <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
  </head>
  <body>
    <a class="skip" href="#conteudo">Ir para o conteúdo</a>

    <header class="site-header">
      <div class="header-bar">
        <a class="logo" href="../../index.html">
          <span class="logo-mark"><img src="../../assets/logo.svg" alt="" width="26" height="26"></span>
          <span>Food<span class="logo-accent">Tech</span></span>
        </a>

        <input class="menu-toggle" id="menu-toggle" type="checkbox" aria-label="Abrir menu">
        <label class="menu-button" for="menu-toggle">
          <span class="menu-lines" aria-hidden="true"></span>
          Menu
        </label>

        <div class="header-panel">
          <nav class="site-nav" aria-label="Navegação">
            <a href="../../index.html#como-funciona">Como funciona</a>
            <a href="list.html" aria-current="page">ONGs</a>
            <a href="../map/index.html">Mapa</a>
          </nav>
          <div class="header-actions">
            <a class="btn btn-outline btn-small" href="../auth/login.html">Entrar</a>
            <a class="btn btn-primary btn-small" href="../cadastro.html">Cadastrar</a>
          </div>
        </div>
      </div>
    </header>

    <main class="page" id="conteudo">
      <a class="back-link" href="list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Todas as ONGs
      </a>

      <p class="form-status" id="status-msg" role="status" hidden></p>

      <div id="ong-profile" class="ong-profile" hidden>
        <section class="ong-banner">
          <span class="avatar" id="ong-avatar" aria-hidden="true"></span>
          <div class="ong-banner-copy">
            <p class="eyebrow">ONG parceira</p>
            <h1 id="ong-nome"></h1>
            <p id="ong-cidade"></p>
          </div>
          <div class="ong-profile-actions">
            <a class="btn btn-primary btn-lg" id="ong-doar" href="../doacoes/nova.html">
              Doar para esta ONG
              <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
            <a class="btn btn-outline btn-lg" id="ong-mensagem" href="../painel/index.html#mensagens">Enviar mensagem</a>
          </div>
        </section>

        <div>
          <section class="panel">
            <h2>Sobre a organização</h2>
            <p id="ong-descricao" class="ong-profile-desc"></p>
          </section>
          <section class="panel">
            <h2>Alimentos aceitos</h2>
            <div id="ong-alimentos" class="ong-card-tags"></div>
          </section>
        </div>

        <aside class="panel">
          <h2>Contato</h2>
          <dl class="info-rows">
            <div class="info-row">
              <span class="info-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 5 6a2 2 0 0 1 2-2"/></svg>
              </span>
              <div><dt>Telefone</dt><dd id="ong-telefone"></dd></div>
            </div>
            <div class="info-row">
              <span class="info-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <div><dt>E-mail</dt><dd id="ong-email"></dd></div>
            </div>
            <div class="info-row">
              <span class="info-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
              </span>
              <div><dt>Endereço</dt><dd id="ong-endereco"></dd></div>
            </div>
          </dl>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <p class="footer-bottom">© 2026 FoodTech · Conectando pessoas e alimentos.</p>
    </footer>

    <script src="../../js/main.js" defer></script>
    <script src="../../js/services/api.js" defer></script>
    <script src="../../js/services/ongService.js" defer></script>
    <script src="../../js/ongProfile.js" defer></script>
  </body>
</html>
