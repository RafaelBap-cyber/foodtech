<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de ONG — FoodTech</title>
    <meta name="description" content="Cadastre sua ONG no FoodTech para receber doações.">
    <link rel="icon" href="../../assets/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
  </head>
  <body class="login-body">
    <header class="login-top">
      <a class="logo" href="../../index.html">
        <img src="../../assets/logo.jpg" alt="" width="42" height="42">
        <span>FoodTech</span>
      </a>
      <a class="text-link" href="../cadastro.html">Trocar perfil</a>
    </header>

    <main class="login-main">
      <section class="login-card">
        <p class="choice-kicker">Organização</p>
        <h1>Criar conta de ONG</h1>
        <p class="lede">Use esta conta para receber doações e falar com doadores.</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="name">Nome da ONG</label>
            <input id="name" name="name" type="text" autocomplete="organization" placeholder="Nome da organização" required>
            <p class="field-error" id="name-error" hidden></p>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="contato@ong.org" required>
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="phone">Telefone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" required>
            <p class="field-error" id="phone-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required>
            <p class="field-error" id="password-error" hidden></p>
          </div>

          <fieldset class="form-group">
            <legend>Endereço</legend>
            <p class="field-hint">Usado para mostrar a ONG no mapa.</p>
            <div class="field-row">
              <div class="field">
                <label for="street">Rua</label>
                <input id="street" name="street" type="text" autocomplete="address-line1" placeholder="Rua das Flores" required>
                <p class="field-error" id="street-error" hidden></p>
              </div>
              <div class="field">
                <label for="number">Número</label>
                <input id="number" name="number" type="text" inputmode="numeric" placeholder="100" required>
                <p class="field-error" id="number-error" hidden></p>
              </div>
            </div>
            <div class="field">
              <label for="neighborhood">Bairro <span class="opcional">(opcional)</span></label>
              <input id="neighborhood" name="neighborhood" type="text" placeholder="Centro">
            </div>
            <div class="field-row">
              <div class="field">
                <label for="city">Cidade</label>
                <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Sorocaba" required>
                <p class="field-error" id="city-error" hidden></p>
              </div>
              <div class="field">
                <label for="state">UF</label>
                <input id="state" name="state" type="text" autocomplete="address-level1" maxlength="2" placeholder="SP" required>
                <p class="field-error" id="state-error" hidden></p>
              </div>
            </div>
            <div class="field">
              <label for="zipCode">CEP <span class="opcional">(opcional)</span></label>
              <input id="zipCode" name="zipCode" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000">
            </div>
          </fieldset>

          <div class="field">
            <label for="description">Descrição da ONG <span class="opcional">(opcional)</span></label>
            <input id="description" name="description" type="text" placeholder="Como a organização atua">
          </div>

          <fieldset class="form-group">
            <legend>Alimentos aceitos</legend>
            <div class="food-options" id="food-options">
              <p class="field-hint">Carregando...</p>
            </div>
          </fieldset>

          <button class="btn btn-primary btn-block" type="submit">Cadastrar</button>
          <p class="form-status" id="form-status" role="status" hidden></p>
        </form>

        <p class="login-switch">
          Já tem conta?
          <a href="login.html">Entrar</a>
        </p>
      </section>
    </main>

    <script src="../../js/session.js" defer></script>
    <script src="../../js/services/api.js" defer></script>
    <script src="../../js/services/authService.js" defer></script>
    <script src="../../js/register.js" defer></script>
  </body>
</html>
