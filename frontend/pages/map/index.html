<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa de ONGs — FoodTech</title>
    <meta name="description" content="Encontre ONGs perto de você no mapa do FoodTech.">
    <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/map.css">
  </head>
  <body>
    <a class="skip" href="#conteudo">Ir para o conteúdo</a>

    <header class="site-header">
      <div class="header-bar">
        <a class="logo" href="../../index.html">
          <span class="logo-mark"><img src="../../assets/logo.svg" alt="" width="26" height="26"></span>
          <span>Food<span class="logo-accent">Tech</span></span>
        </a>

        <input class="menu-toggle" id="menu-toggle" type="checkbox" aria-label="Abrir menu">
        <label class="menu-button" for="menu-toggle">
          <span class="menu-lines" aria-hidden="true"></span>
          Menu
        </label>

        <div class="header-panel">
          <nav class="site-nav" aria-label="Navegação">
            <a href="../../index.html#como-funciona">Como funciona</a>
            <a href="../ong/list.html">ONGs</a>
            <a href="index.html" aria-current="page">Mapa</a>
          </nav>
          <div class="header-actions">
            <a class="btn btn-outline btn-small" href="../auth/login.html">Entrar</a>
            <a class="btn btn-primary btn-small" href="../cadastro.html">Cadastrar</a>
          </div>
        </div>
      </div>
    </header>

    <main class="page" id="conteudo">
      <section class="page-hero">
        <div>
          <p class="eyebrow">Mapa</p>
          <h1>Encontre ONGs perto de você</h1>
          <p class="lede">Filtre pelo alimento que você quer doar ou pela distância até a sua casa.</p>
        </div>
      </section>

      <section class="map-filters" aria-label="Filtros">
        <div class="map-filter">
          <label for="filtro-alimento">Alimento</label>
          <div class="map-filter-controls">
            <div class="search-bar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="filtro-alimento" placeholder="Ex.: arroz, leite, feijão" autocomplete="off">
            </div>
            <button class="btn btn-primary" type="button" id="btn-filtrar-alimento">Filtrar</button>
            <button class="btn btn-ghost" type="button" id="btn-limpar-filtro">Limpar</button>
          </div>
        </div>

        <div class="map-filter">
          <label for="filtro-distancia">Distância</label>
          <div class="map-filter-controls">
            <select id="filtro-distancia">
              <option value="">Selecione</option>
              <option value="5">Até 5 km</option>
              <option value="10">Até 10 km</option>
              <option value="20">Até 20 km</option>
              <option value="50">Até 50 km</option>
            </select>
            <button class="btn btn-coral" type="button" id="btn-filtrar-distancia">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
              Usar minha localização
            </button>
            <button class="btn btn-ghost" type="button" id="btn-limpar-distancia">Limpar</button>
          </div>
          <p class="map-filter-status" id="status-distancia" role="status" hidden></p>
        </div>
      </section>

      <p class="form-status" id="status-msg" role="status" hidden></p>

      <div class="map-frame">
        <div id="mapa" role="region" aria-label="Mapa das ONGs"></div>
      </div>

      <div class="results-bar">
        <h2 class="section-title">Instituições cadastradas</h2>
        <p class="results-count" id="ong-count" aria-live="polite"></p>
      </div>

      <div class="ong-grid" id="ong-list"></div>
    </main>

    <footer class="site-footer">
      <p class="footer-bottom">© 2026 FoodTech · Conectando pessoas e alimentos.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../../js/main.js" defer></script>
    <script src="../../js/services/api.js" defer></script>
    <script src="../../js/services/ongService.js" defer></script>
    <script src="../../js/ongMap.js" defer></script>
    <script src="../../js/map.js" defer></script>
  </body>
</html>
