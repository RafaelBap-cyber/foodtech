<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar como doador — FoodTech</title>
    <meta name="description" content="Login de usuário do FoodTech para quem deseja doar alimentos.">
    <link rel="icon" href="../../assets/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
  </head>
  <body class="login-body">
    <header class="login-top">
      <a class="logo" href="../../index.html">
        <img src="../../assets/logo.jpg" alt="" width="42" height="42">
        <span>FoodTech</span>
      </a>
      <a class="text-link" href="../../index.html">Voltar ao início</a>
    </header>

    <main class="login-main">
      <section class="login-card">
        <p class="choice-kicker">Usuário</p>
        <h1>Entrar como doador</h1>
        <p class="lede">Use sua conta para oferecer alimentos e acompanhar a doação.</p>

        <form id="login-form" data-profile="donor" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mínimo de 6 caracteres" required>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
          <p class="form-status" id="form-status" role="status" hidden></p>
        </form>

        <p class="login-switch">
          Representa uma organização?
          <a href="../ong/login.html">Entrar como ONG</a>
        </p>
      </section>
    </main>

    <script src="../../js/session.js" defer></script>
    <script src="../../js/services/authService.js" defer></script>
    <script src="../../js/login.js" defer></script>
  </body>
</html>
